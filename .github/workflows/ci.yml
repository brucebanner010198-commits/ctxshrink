name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ctxshrink (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check python/ tests/

      - name: Test (pytest)
        run: pytest tests/python -q

  js-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install
        working-directory: js
        run: npm ci

      - name: Test (node --test)
        working-directory: js
        run: npm test

  parity:
    name: Cross-language parity
    runs-on: ubuntu-latest
    needs: [python-test, js-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install ctxshrink (Python)
        run: pip install -e .

      - name: Install ctxshrink (JavaScript)
        working-directory: js
        run: npm ci

      - name: Compare Python vs JavaScript benchmark output
        run: python3 scripts/check_parity.py

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ctxshrink:ci .

      - name: "Smoke test: Python CLI compress"
        run: echo '{"a":1,"b":[1,2,3]}' | docker run --rm -i ctxshrink:ci compress --level 1 --stats

      - name: "Smoke test: JavaScript CLI compress"
        run: echo '{"a":1,"b":[1,2,3]}' | docker run --rm -i ctxshrink:ci js compress --level 1 --stats

      - name: "Smoke test: benchmark"
        run: docker run --rm ctxshrink:ci benchmark