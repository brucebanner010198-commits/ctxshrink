<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ctxshrink dashboard</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>ctxshrink</h1>
  <p class="subtitle">token reduction metrics</p>
  <button id="refresh">Refresh</button>
</header>

<main>
  <section id="summary" class="cards"></section>

  <section>
    <h2>By content type</h2>
    <div id="by-type"></div>
  </section>

  <section>
    <h2>Files</h2>
    <table id="rows-table">
      <thead>
        <tr>
          <th>file</th><th>type</th><th>level</th><th>method</th>
          <th>original tokens</th><th>result tokens</th><th>saved</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <footer>
    <p>Numbers are local <code>estimated</code> token counts, not a provider invoice.
       Generated: <span id="generated-at">-</span></p>
  </footer>
</main>

<script src="/app.js"></script>
</body>
</html>
